<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f0">
<meta name="robots" content="noindex,nofollow">
<title>Mienta - معاينة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f0;--s:#fff;--s2:#f5f0e3;--b:#ece4d2;--acc:#e8b923;--accx:#8a6500;--grn:#067647;--org:#c2650a;--red:#d92d20;--txt:#1f1b14;--txt2:#6b6252;--muted:#8a8171}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;padding:0 16px 40px;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.brand{font-size:20px;font-weight:900}.brand span{color:var(--accx)}
.tag{font-size:11px;font-weight:700;background:var(--s);border:1px solid var(--b);border-radius:20px;padding:4px 10px;color:var(--txt2)}
.row{display:flex;gap:8px;margin-bottom:10px}
select,input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--b);background:var(--s);color:var(--txt);font-family:inherit;font-size:14px;font-weight:700}
.tabs{display:flex;gap:6px;margin:6px 0 14px;overflow-x:auto}
.tab{flex:1;white-space:nowrap;padding:9px 12px;border-radius:12px;border:1px solid var(--b);background:var(--s);font-family:inherit;font-size:13px;font-weight:900;color:var(--txt2)}
.tab.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lbl{font-size:12px;color:var(--txt2);font-weight:700}.big{font-size:26px;font-weight:900;line-height:1.3}
.h{font-size:15px;font-weight:900;margin:16px 0 8px}
.bar{height:8px;border-radius:6px;background:#f1ead9;margin:6px 0}.bar i{display:block;height:100%;border-radius:6px;background:var(--acc)}
.sm{font-size:11px;color:var(--muted)}.proj{font-size:12px;font-weight:700;margin-top:4px}
.it{display:flex;align-items:center;gap:10px}.it .n{flex:1;min-width:0;font-size:13px;font-weight:700}.it .q{font-size:20px;font-weight:900;color:var(--accx)}
.chip{display:inline-block;background:var(--s2);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;margin:4px 4px 0 0}
.empty{text-align:center;color:var(--muted);padding:24px;font-size:13px}
.upd{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
button.rf{background:none;border:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--accx)}
.pg{display:none}.pg.on{display:block}
</style>
</head>
<body>
<div class="top"><div class="brand">Mienta<span> · معاينة</span></div><div><span class="tag">👁 للقراءة فقط</span> <button class="rf" onclick="load()">تحديث</button></div></div>
<div class="row"><select id="mon" onchange="cur=this.value;render()"></select></div>
<div class="tabs">
 <button class="tab on" data-t="home" onclick="tab('home')">الملخص</button>
 <button class="tab" data-t="prod" onclick="tab('prod')">المنتجات</button>
 <button class="tab" data-t="stock" onclick="tab('stock')">المخزون</button>
</div>

<div class="pg on" id="p-home">
 <div class="grid"><div class="card"><div class="lbl">الإيراد</div><div class="big" id="rev">-</div></div><div class="card"><div class="lbl">القطع المباعة</div><div class="big" id="pcs">-</div></div></div>
 <div class="card" id="today"></div>
 <div class="card" id="team"></div>
 <div class="h">👥 البائعين</div><div id="sellers"></div>
</div>

<div class="pg" id="p-prod">
 <div class="row"><input id="q" type="search" placeholder="🔍 ابحث باسم أو كود المنتج" oninput="renderProd()"><select id="so" onchange="renderProd()" style="flex:.8"><option value="most">الأكثر مبيعاً</option><option value="least">الأقل مبيعاً</option><option value="rev">الأعلى إيراداً</option><option value="name">الاسم</option></select></div>
 <div class="sm" id="psum" style="margin-bottom:8px;font-weight:700"></div><div id="plist"></div>
</div>

<div class="pg" id="p-stock">
 <div class="row"><input id="sq" type="search" placeholder="🔍 ابحث في المخزون" oninput="renderStock()"><select id="sf" onchange="renderStock()" style="flex:.8"><option value="all">الكل</option><option value="have">متوفر</option><option value="low">منخفض (3 أو أقل)</option><option value="zero">نفذ</option></select></div>
 <div class="sm" id="ssum" style="margin-bottom:8px;font-weight:700"></div><div id="slist"></div>
</div>

<div class="upd" id="upd">جاري التحميل...</div>

<script>
var SB_URL="https://fygkxynsuiqybvxxdslf.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5Z2t4eW5zdWlxeWJ2eHhkc2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NjI4MTIsImV4cCI6MjA5ODEzODgxMn0.ihfx0E9lfXPFAubNMuliqMOOPtb0XYGQFG07NCmS_6s";
var NAMES={"479766": "BLENDER 500W BL1251A MIENTA", "391114": "BLENDER BL1221A 600W 1.5L MIENTA", "674727": "MIENTA A.COOLER AC49338A 85L ANLG", "674728": "MIENTA A.COOLER AC49438A 75L ANLG", "674729": "MIENTA A.COOLER AC49438B 75L DIG", "646038": "MIENTA AF AF47734A 12L 1500W", "573702": "MIENTA AIR FRYER AF47434A 1500W 4.2L", "575523": "MIENTA AIR FRYER AF47534A MEGA 5.5L", "579413": "MIENTA AIR FRYER AF47634A 8L DIGITAL", "673257": "MIENTA AIR FRYER AF47835A 5.7L DIG", "552611": "MIENTA AIRFRYER AF47234A 1700W 5.5L", "551077": "MIENTA BLENDER BL1251B 500W BLACK", "668430": "MIENTA BLENDER BL1271G 800W BLACK", "599163": "MIENTA CHOPPER CH23738A 500W 2L", "621104": "MIENTA CITRUS JUICER CP10308B 40W", "548856": "MIENTA CITRUS JUICER CP10429A 30W", "664991": "MIENTA COFFEE GRINDER CG44235A 150W", "473966": "MIENTA COFFEE MAKER CM31216A", "489183": "MIENTA COFFEE MAKER CM31316A 6CUPS", "647701": "MIENTA COFFEE MAKER CM31416A 1CUP", "518296": "MIENTA COMPACT GRILL CG28209A 2000W", "638392": "MIENTA ESPRESSO MACHINE CM31916A", "654382": "MIENTA FOOD PROCESSOR FP141335A 1000W MILLE", "654381": "MIENTA FOOD PROCESSOR FP141435A 1000W COMBI", "654380": "MIENTA FOOD PROCESSOR FP141535A 1000W FULL SET", "664988": "MIENTA GARMENT STEAMER GS421131B 1800W", "434373": "MIENTA GRILL HG34109A 2200W", "664989": "MIENTA HAND BLENDER HB111635A 1000W 4IN1", "664990": "MIENTA HAND BLENDER HB111735A 1000W 7IN1", "599161": "MIENTA HAND BLENDER HB11938A SINGLE 1000W", "624473": "MIENTA HAND BLENDER HB111238A 1000W BLACK", "649738": "MIENTA HANDHELD STEAMER GS42709A 1960W", "674730": "MIENTA HAND BLENDER HB111938A 450W", "654377": "MIENTA HAND MIXER HM13729A 500W", "473963": "MIENTA HOT PLATE HP41125B 1500W BLACK", "590915": "MIENTA STEAM IRON SI181109A 2400W", "667084": "MIENTA STEAM IRON SI181740C 2400W", "638564": "MIENTA KITCHEN MACHINE KM38332A 1300W BLACK", "623145": "MIENTA KITCHEN MACHINE KM38232C 1300W BLACK", "649736": "MIENTA KETTLE EK201020A 1.7L STEEL", "634672": "MIENTA KETTLE EK201520A 1.7L GLASS", "621100": "MIENTA KETTLE EK201737A 1.7L BLACK", "664739": "MIENTA KETTLE EK201937A 1.7L 2200W", "667083": "MIENTA KETTLE EK201937B 1.7L BLACK", "649737": "MIENTA KETTLE EK20820B 1.7L BLACK", "473968": "MIENTA KETTLE EK20920A 1.7L 2150W", "675734": "MIENTA MICROWAVE MW321217A 30L", "654386": "MIENTA STAND FAN SF351238A 18IN REMOTE", "654378": "MIENTA STEAM IRON SI181540A 2300W", "578594": "MIENTA SANDWICH MAKER SM27809A 2IN1", "659630": "MIENTA STAND MIXER KM38432A 10L 6SPEEDS", "654385": "MIENTA STAND FAN SF351138A 18 INCH", "675736": "MIENTA STEAM IRON GS42809A 1630W", "534765": "MIENTA TURKISH COFFEE MAKER CM31528A", "649731": "MIENTA UPRIGHT STEAMER GS421131A 1800W BLACK", "556225": "MIENTA VACUUM CLEANER VC19504A 2000W", "674724": "MIENTA WALL FAN WF50638A 18IN REMOTE", "654855": "MIENTA HAND BLENDER HB111338A SINGLE 1000W SILVER", "633556": "MIENTA KETTLE GLASS EK201837A 1.7L", "601775": "MIENTA CHOPPER CH23838A 450W 1.5L", "674731": "MIENTA BLENDER BL1281G 600W BK", "649119": "MIENTA H.B SET HB111438A 1000W SIL", "577312": "MIENTA CITRUS PRESS 40W CP103", "679705": "MIENTA ST.MIXER KM38432B 10L 6SPDS", "596356": "MIENTA CHOPPER CH2331B BLACK", "689718": "MIENTA H.B HB112035A 1000W STAINLES", "688912": "MIENTA I.ST SI181740B 2400W CER B*R", "689734": "MIENTA I.ST SI181540C 2300W", "690716": "MIENTA H.B HB112135A 7*1 1000W ST", "688911": "MIENTA I.ST SI181740A 2400W CER B*B", "682254": "MIENTA MIXER BOWL KMLV008W 1000W", "529414": "MIENTA GARMENT STEAMER GS42509A", "649732": "MIENTA H.B HB111538A 1000W SILVER", "674722": "MIENTA ST FAN SF351438A 18' REMOTE", "655630": "MIENTA S.M SM27409A 750W 3*1", "674725": "MIENTA W.FAN WF50538A 18'", "489184": "MIENTA DOUBLE HOT PLATE 2500W", "686267": "MIENTA K.M KM38732A 2000W 12L", "682255": "MIENTA MIXER BOWL KM38632A 2000W", "518297": "MIENTA S.MAKER 4SLICES SM27609A", "686266": "MIENTA CHOPPER CH23938A 750W 2L", "688910": "MIENTA AF AF47935A 2000W 8L DIG", "621103": "MIENTA CHOPPER CH2331A 450W 500ML", "674723": "MIENTA ST FAN SF351338A 18'", "677052": "MIENTA OVEN OV301038A 48L-GRIL2000W", "689719": "MIENTA MIC MW321417A 25L GRILL", "661177": "MIENTA BLENDER BL1261G 450W 1.75L B", "682253": "MIENTA FP FPLV083W 1000W WHITE", "624270": "MIENTA VC VC19604B BAGLESS 2000W", "674732": "MIENTA BLENDER BL1291G 700W BK"};
var D=null,cur=null;
var MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function n(x){return Number(x||0).toLocaleString('ar-EG')}
function tab(t){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on')});
  document.getElementById('p-'+t).classList.add('on');
}
function load(){
  var h={'apikey':SB_KEY};
  if(SB_KEY.indexOf('sb_')!==0)h.Authorization='Bearer '+SB_KEY;
  fetch(SB_URL+"/rest/v1/inventory_data?id=eq.main&select=data,updated_at",{method:'GET',headers:h,cache:'no-store'})
   .then(function(r){return r.json()}).then(function(a){
     if(!a||!a[0])throw 0;
     D=a[0].data;
     document.getElementById('upd').textContent='آخر تحديث للبيانات: '+new Date(a[0].updated_at).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
     (D.custom||[]).forEach(function(c){NAMES[c.code]=NAMES[c.code]||c.desc});
     render();
   }).catch(function(){document.getElementById('upd').textContent='⚠️ مش قادر أحمل البيانات، جرب تحديث'});
}
function months(){
  var s={},c=new Date().toISOString().slice(0,7);s[c]=1;
  (D.sales||[]).forEach(function(x){if(x.date)s[x.date.slice(0,7)]=1});
  return Object.keys(s).sort().reverse();
}
function ms(){return (D.sales||[]).filter(function(x){return x.date&&x.date.slice(0,7)===cur})}
function render(){
  if(!D)return;
  var m=months();if(!cur||m.indexOf(cur)<0)cur=m[0];
  document.getElementById('mon').innerHTML=m.map(function(k){return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+MN[+k.slice(5,7)-1]+' '+k.slice(0,4)+'</option>'}).join('');
  var s=ms(),rev=0,pcs=0;s.forEach(function(x){rev+=x.total||0;pcs+=x.qty});
  document.getElementById('rev').textContent=n(rev)+' ج';
  document.getElementById('pcs').textContent=n(pcs);
  // today (latest day with sales in the month)
  var days={};s.forEach(function(x){days[x.date]=(days[x.date]||{r:0,q:0});days[x.date].r+=x.total||0;days[x.date].q+=x.qty});
  var dk=Object.keys(days).sort(),t=document.getElementById('today');
  if(dk.length){var d=dk[dk.length-1];t.innerHTML='<div class="lbl">آخر يوم فيه مبيعات ('+d+')</div><div class="big" style="font-size:20px">'+n(days[d].r)+' ج · '+n(days[d].q)+' قطعة</div>'}else t.innerHTML='<div class="empty">مفيش مبيعات في الشهر ده</div>';
  // targets
  var T=(D.targets||{})[cur]||{},nd=new Date(),isCur=cur===nd.toISOString().slice(0,7);
  var dim=new Date(nd.getFullYear(),nd.getMonth()+1,0).getDate(),dn=nd.getDate(),left=Math.max(0,dim-dn);
  function proj(a,tv,unit){
    if(!isCur||a>=tv)return '';
    var p=a/dn*dim,ok=p>=tv;
    return '<div class="proj" style="color:'+(ok?'var(--grn)':'var(--org)')+'">'+(ok?'✅ بالمعدل ده هيوصل ':'⚠️ بالمعدل ده هيقفل على ')+n(Math.round(p))+' '+unit+'</div>'+(left>0?'<div class="sm">المطلوب '+n(Math.ceil((tv-a)/left))+' '+unit+' في اليوم لمدة '+left+' يوم</div>':'');
  }
  var tm=document.getElementById('team');
  if(T.value){var ach=T.type==='qty'?pcs:rev,u=T.type==='qty'?'قطعة':'ج',pc=Math.min(100,ach/T.value*100);
    tm.innerHTML='<div class="lbl">🎯 التارجت الجماعي</div><div class="big" style="font-size:20px">'+n(ach)+' / '+n(T.value)+' '+u+' <span class="sm">('+pc.toFixed(0)+'%)</span></div><div class="bar"><i style="width:'+pc+'%"></i></div>'+(ach>=T.value?'<div class="proj" style="color:var(--grn)">🏆 تحقق التارجت</div>':'<div class="sm">باقي '+n(T.value-ach)+' '+u+'</div>'+proj(ach,T.value,u));
  }else tm.innerHTML='<div class="empty">مفيش تارجت جماعي للشهر ده</div>';
  // sellers
  var ag={};s.forEach(function(x){var k=x.sellerName||'غير محدد';var a=ag[k]||(ag[k]={r:0,q:0});a.r+=x.total||0;a.q+=x.qty});
  var names=(D.sellersList||[]).map(function(x){return x.name});Object.keys(ag).forEach(function(k){if(names.indexOf(k)<0)names.push(k)});
  names.sort(function(a,b){return ((ag[b]||{r:0}).r)-((ag[a]||{r:0}).r)});
  var per=T.perSeller||{};
  document.getElementById('sellers').innerHTML=names.map(function(k){
    var a=ag[k]||{r:0,q:0},tg=per[k]||{},h='<div class="card"><div class="it"><div class="n">'+k+'</div><div class="q" style="font-size:16px">'+n(a.r)+' ج</div></div><div class="sm">'+n(a.q)+' قطعة</div>';
    if(tg.rev>0){var pc=Math.min(100,a.r/tg.rev*100);h+='<div class="bar"><i style="width:'+pc+'%"></i></div><div class="sm">تارجت '+n(tg.rev)+' ج · '+pc.toFixed(0)+'%</div>'+proj(a.r,tg.rev,'ج')}
    return h+'</div>';
  }).join('')||'<div class="empty">لا يوجد</div>';
  renderProd();renderStock();
}
function renderProd(){
  if(!D)return;
  var ag={};ms().forEach(function(x){var a=ag[x.code]||(ag[x.code]={code:x.code,d:x.desc,q:0,r:0,s:{}});a.q+=x.qty;a.r+=x.total||0;var k=x.sellerName||'—';a.s[k]=(a.s[k]||0)+x.qty});
  var q=document.getElementById('q').value.trim().toLowerCase(),so=document.getElementById('so').value;
  var it=Object.keys(ag).map(function(k){return ag[k]}).filter(function(a){return !q||(a.d||'').toLowerCase().indexOf(q)>=0||String(a.code).indexOf(q)>=0});
  it.sort(function(a,b){return so==='least'?a.q-b.q:so==='rev'?b.r-a.r:so==='name'?(a.d||'').localeCompare(b.d||''):b.q-a.q});
  var tot=0;it.forEach(function(a){tot+=a.q});
  document.getElementById('psum').textContent=it.length?it.length+' صنف · '+n(tot)+' قطعة':'';
  var mx=Math.max.apply(null,it.map(function(a){return a.q}).concat([1]));
  document.getElementById('plist').innerHTML=it.map(function(a){
    var ch=Object.keys(a.s).sort(function(x,y){return a.s[y]-a.s[x]}).map(function(k){return '<span class="chip">'+k+' '+a.s[k]+'</span>'}).join('');
    return '<div class="card" style="padding:12px 14px"><div class="it"><div class="n">'+a.d+'</div><div style="text-align:left"><div class="q">'+a.q+'</div>'+(a.r>0?'<div class="sm">'+n(a.r)+' ج</div>':'')+'</div></div><div class="bar"><i style="width:'+Math.max(6,a.q/mx*100)+'%"></i></div>'+ch+'</div>';
  }).join('')||'<div class="empty">'+(q?'مفيش نتيجة':'مفيش مبيعات في الشهر ده')+'</div>';
}
function renderStock(){
  if(!D)return;
  var qt=D.qty||{},q=document.getElementById('sq').value.trim().toLowerCase(),f=document.getElementById('sf').value;
  var it=Object.keys(qt).map(function(k){return {c:k,d:NAMES[k]||('كود '+k),q:qt[k]}}).filter(function(a){
    if(q&&a.d.toLowerCase().indexOf(q)<0&&a.c.indexOf(q)<0)return false;
    return f==='have'?a.q>0:f==='low'?(a.q>0&&a.q<=3):f==='zero'?a.q===0:true;
  }).sort(function(a,b){return a.q-b.q});
  var tot=0;it.forEach(function(a){tot+=a.q});
  document.getElementById('ssum').textContent=it.length+' صنف · '+n(tot)+' قطعة';
  document.getElementById('slist').innerHTML=it.map(function(a){
    var col=a.q===0?'var(--red)':a.q<=3?'var(--org)':'var(--accx)';
    return '<div class="card" style="padding:10px 14px"><div class="it"><div class="n">'+a.d+'<div class="sm">#'+a.c+'</div></div><div class="q" style="color:'+col+'">'+(a.q===0?'نفذ':a.q)+'</div></div></div>';
  }).join('')||'<div class="empty">مفيش نتيجة</div>';
}
load();setInterval(load,60000);
</script>
</body>
</html>
